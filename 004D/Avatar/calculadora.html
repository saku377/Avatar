    <h1>Operaciones matematicas</h1>
    <div class="container">
        <form>
            <div class="mb-3">
                <label for="n1" class="form-label">Primer Numero</label>
                <input type="number" class="form-control" id="n1">
            </div>
            <div class="mb-3">
                <label for="n2" class="form-label">Segundo Numero</label>
                <input type="number" class="form-control" id="n2">
            </div>
            
        </form>
            <button type="submit" class="btn btn-info onclick="sumar()">Sumar</button>
            <button type="submit" class="btn btn-success onclick="restar()">Restar</button>
            <button type="submit" class="btn btn-danger" onclick="mult()">Multiplicar</button>
            <button type="submit" class="btn btn-warning onclick="div()">Dividir</button>


            <p id="resultado"></p>
            </div>
        <script>

            function sumar(){
                let num1= document.getElementById("n1").value;
                let num2= document.getElementById("n2").value;
                let sum= parseFloat(num1)+ parseFloat(num2)
                console.log(sum);
                document.getElementById("resultado").innerHTML=("El resultado es: " +sum)
            }



            function restar(){
                let num1= document.getElementById("n1").value;
                let num2= document.getElementById("n2").value;
                let rest= parseFloat(num1)- parseFloat(num2)
                console.log(rest);
                document.getElementById("resultado").innerHTML=("El resultado es: " +rest)
            }

            function mult(){
                let num1= document.getElementById("n1").value;
                let num2= document.getElementById("n2").value;
                let mult= parseFloat(num1) * parseFloat(num2)
                console.log(mult);
                document.getElementById("resultado").innerHTML=("El resultado es: " +mult)
            }
            function div(){
                let num1= document.getElementById("n1").value;
                let num2= document.getElementById("n2").value;
                let div= parseFloat(num1) / parseFloat(num2)
                console.log(div);
                document.getElementById("resultado").innerHTML=("El resultado es: " +div)
            }
        </script>
